# ================================================
# Nginx 反向代理配置
# 标准审查助手
# 使用方法：
#   1. 将此文件保存为 deploy/nginx.conf
#   2. 准备 SSL 证书（见下方注释）
#   3. 修改 server_name 为你的域名
#   4. 配合 docker-compose.yml 中的 nginx 服务使用，或单独部署
# ================================================

upstream claw_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

