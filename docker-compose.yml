version: "3.8"

# ================================================
# 标准审查助手 - docker-compose 生产配置
# ================================================
services:
  claw:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: claw-review
    # 前端/API 端口
    ports:
      - "8000:8000"
    # 数据持久化：宿主机 data/ 目录挂载到容器
    volumes:
      - ./data:/app/data
    environment:
      # AI API（通过 .env 文件注入，容器内读取）
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      # 生产模式关闭 debug
      - DEBUG=false
    restart: unless-stopped
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # 可选：Nginx 反向代理 + 静态文件缓存（需要 SSL 证书）
