<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>化妆品标准智能审查系统 - 化妆品标准/检验方法智能审查系统</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/kanban.css">
    <style>
        /* 页面过渡动画 */
        #main-content {
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 英雄区（仅首屏显示） */
        .hero-banner {
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 40%, #1A56DB 100%);
            padding: 48px 24px;
            text-align: center;
            color: white;
            margin-bottom: 0;
        }
        .hero-banner h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }
        .hero-banner h1 span {
            background: linear-gradient(90deg, #60A5FA, #A78BFA);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero-banner p {
            font-size: 16px;
            opacity: 0.75;
            max-width: 560px;
            margin: 0 auto;
        }
        .hero-features {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 28px;
            flex-wrap: wrap;
        }
        .hero-feature {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            opacity: 0.85;
        }
        .hero-feature .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #60A5FA;
        }
    </style>
</head>
<body>

    <!-- 导航栏 -->
    <nav class="navbar">
        <a href="#standards" class="logo">
            <div class="logo-icon">📐</div>
            <div style="display:flex;align-items:center;gap:8px">
                <span class="logo-text">化妆品标准审查</span>
                <span style="font-size:11px;color:var(--text-muted);border-left:1px solid var(--border);padding-left:8px">化妆品标准初稿智能审查</span>
            </div>
        </a>
        <div class="nav-links">
            <a href="#standards" data-page="standards">📚 标准库</a>
            <a href="#new-review" data-page="new-review">🔍 新建审查</a>
            <a href="#history" data-page="history">📊 看板</a>
        </div>
    </nav>

    <!-- 英雄区（首屏装饰） -->
    <div class="hero-banner" id="hero-banner">
        <h1>化妆品标准/检验方法 <span>智能审查</span> 系统</h1>
        <p>专为化妆品检验方法、补充检验方法等标准初稿设计的智能审查系统，结合 AI 大模型多维度分析</p>
        <div class="hero-features">
            <div class="hero-feature"><div class="dot"></div>检验方法结构检查</div>
            <div class="hero-feature"><div class="dot"></div>术语与格式合规性</div>
            <div class="hero-feature"><div class="dot"></div>数据参数完整性</div>
            <div class="hero-feature"><div class="dot"></div>AI 语义深度对比</div>
        </div>
    </div>

    <!-- 主内容区 -->
    <div id="main-content" style="min-height:calc(100vh - 64px - 200px)">
        <!-- 由 JavaScript 动态渲染 -->
        <div style="text-align:center;padding:80px;color:var(--text-muted)">
            <div class="spinner" style="width:40px;height:40px;border-width:4px;margin:0 auto 16px"></div>
            <p>正在加载...</p>
        </div>
    </div>

    <!-- Toast 容器 -->
    <div id="toast-container" class="toast-container"></div>

    <!-- 脚本 -->
    <script src="js/api.js?v=20260411"></script>
    <script src="js/app.js?v=20260411"></script>
    <script src="js/batch_review.js?v=20260411"></script>
    <script>
        // API 地址配置（Railway 部署时使用）
        // 本地开发: 空（使用相对路径 /api）
        // 远程部署: 通过 URL 参数 ?api=xxx 或全局变量 window.API_BASE 设置
        window.API_BASE = window.API_BASE ||
            new URLSearchParams(location.search).get('api') ||
            '/api';
    </script>
    <script>
        // 非首页时隐藏英雄区
        function updateHero(page) {
            const hero = document.getElementById('hero-banner');
            if (hero) hero.style.display = page === 'standards' ? '' : 'none';
        }

        // 导航点击高亮
        document.querySelectorAll('.nav-links a').forEach(a => {
            a.addEventListener('click', () => {
                const page = a.dataset.page;
                updateHero(page);
                document.querySelectorAll('.nav-links a').forEach(b => b.classList.remove('active'));
                a.classList.add('active');
            });
        });

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            const page = location.hash.replace('#', '') || 'standards';
            updateHero(page);
            // 设置初始导航高亮
            document.querySelectorAll('.nav-links a').forEach(a => {
                a.classList.toggle('active', a.dataset.page === page);
            });
            APP.init();
        });

        // hash 变化时更新英雄区
        window.addEventListener('hashchange', () => {
            const page = location.hash.replace('#', '') || 'standards';
            updateHero(page);
        });
    </script>
</body>
</html>
